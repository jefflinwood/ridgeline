services:
  - type: web
    name: ridgeline-coffee
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RIDGELINE_API_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
    # No persistent disk on the free plan: the SQLite file resets whenever
    # the instance redeploys or spins back up from idle. app/bootstrap.py
    # re-seeds automatically on an empty database, so the app always comes
    # back with working demo data — but anything logged/edited during a
    # session (roast batches, order status changes) won't survive a spin-down.
    # For a demo that needs to hold state across a full training day, either
    # upgrade to a paid plan and add a persistent disk mounted at /opt/render/project/src,
    # or set DATABASE_URL to a Render Postgres instance instead.
