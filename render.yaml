services:
  - type: web
    name: ridgeline-coffee
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RIDGELINE_API_KEY
        generateValue: true
      - key: MCP_CLASS_PASSWORD
        value: EdenPrairie1
      - key: DATABASE_URL
        fromDatabase:
          name: ridgeline-coffee-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: ridgeline-coffee-db
    plan: 0.1c-256mb
    databaseName: ridgeline_coffee
    user: ridgeline_coffee
