services:
  - type: web
    name: ridgeline-coffee
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RIDGELINE_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ridgeline-coffee-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: ridgeline-coffee-db
    plan: 0.1c-256mb
    databaseName: ridgeline_coffee
    user: ridgeline_coffee
